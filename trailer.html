<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="referrer" content="origin-when-cross-origin" />
        <title>Trailer — Kill Bill: Vol. 1</title>
        <meta name="description" content="Player de trailer próprio sobre o embed do YouTube: controles, tela cheia e giro em aparelho de mão." />
        <meta name="theme-color" content="#0C0B09" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://i.ytimg.com" />
        <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900&family=Karla:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=block" rel="stylesheet" />

        <style>
            :root {
                --ink: #0c0b09;
                --panel: #151309;
                --line: #2a2720;
                --bone: #ece6d8;
                --smoke: #8e887a;
                --sun: #ffd100;
                /* preto das barras sobrepostas ao quadro */
                --curtain: #060504;

                --display: "Archivo", system-ui, sans-serif;
                --body: "Karla", system-ui, sans-serif;
                --mono: "Space Mono", ui-monospace, monospace;
            }

            * {
                box-sizing: border-box;
            }
            [hidden] {
                display: none !important;
            }
            html {
                -webkit-text-size-adjust: 100%;
            }
            /* O vídeo é a página inteira: sem nada em volta, o diálogo apenas se
               centraliza. svh e não vh porque a barra retrátil do navegador não pode
               empurrar o quadro para fora da tela. */
            body {
                margin: 0;
                min-height: 100svh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 16px;
                background: var(--ink);
                color: var(--bone);
                font-family: var(--body);
                font-size: 16px;
                line-height: 1.65;
                overflow-x: hidden;
            }
            img {
                max-width: 100%;
                display: block;
            }
            button {
                font: inherit;
                color: inherit;
                background: none;
                border: 0;
                cursor: pointer;
            }
            :focus-visible {
                outline: 3px solid var(--sun);
                outline-offset: 3px;
            }

            .material-symbols-outlined {
                font-family: "Material Symbols Outlined";
                font-weight: 400;
                font-style: normal;
                line-height: 1;
                letter-spacing: normal;
                text-transform: none;
                display: inline-block;
                white-space: nowrap;
                word-wrap: normal;
                direction: ltr;
                font-variation-settings: "FILL" 1;
            }

            /* ---------- diálogo ---------- */
            .dialog {
                position: relative;
                width: min(100%, 1000px);
                background: var(--panel);
                border: 1px solid var(--line);
                box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
            }
            .dialog__bar {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px 14px;
                border-bottom: 1px solid var(--line);
            }
            .dialog__title {
                flex: 1;
                min-width: 0;
                font-family: var(--mono);
                font-size: 11px;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                color: var(--smoke);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                margin: 0;
            }
            .dialog__title b {
                color: var(--sun);
                font-weight: 700;
            }

            .video {
                position: relative;
                width: 100%;
                aspect-ratio: 16/9;
                background: #000;
                overflow: hidden;
            }
            /* A camada do iframe não recebe toque, e isto resolve duas coisas de uma vez:
               nenhum clique aciona a interface do YouTube, e o overlay de pausa dele
               (cabeçalho, marca e grade de sugestões) nunca chega a ser desenhado, porque
               depende de evento de mouse nascido dentro do iframe — a pausa via postMessage
               não conta como interação. Medido em Chrome e WebKit: 25s pausado, capturas
               byte a byte idênticas. Por isso não há painel cobrindo o quadro na pausa;
               devolver ponteiro a esta camada traz a interface do YouTube junto. */
            .video__stage {
                position: absolute;
                inset: 0;
                overflow: hidden;
                pointer-events: none;
            }
            .video__stage iframe {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 100%;
                height: 100%;
                border: 0;
                transform: translate(-50%, -50%) scale(1.06);
            }
            .video__shield {
                position: absolute;
                inset: 0;
                z-index: 2;
                background: transparent;
                cursor: pointer;
            }

            .endcard {
                position: absolute;
                inset: 0;
                z-index: 4;
                background: rgba(6, 5, 4, 0.94);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
            }
            .endcard__t {
                margin: 0;
                font-family: var(--mono);
                font-size: 11px;
                letter-spacing: 0.24em;
                text-transform: uppercase;
                color: var(--smoke);
            }
            .endcard__btn {
                display: inline-flex;
                align-items: center;
                gap: 9px;
                background: var(--sun);
                color: #100e07;
                padding: 13px 20px;
                font-family: var(--mono);
                font-weight: 700;
                font-size: 11px;
                letter-spacing: 0.2em;
                text-transform: uppercase;
            }
            .video__mask {
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
                background: #000;
                z-index: 2;
            }
            .spinner {
                width: 34px;
                height: 34px;
                border: 3px solid rgba(255, 209, 0, 0.25);
                border-top-color: var(--sun);
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .fallback {
                position: absolute;
                inset: 0;
                z-index: 3;
                background: #0a0906;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 12px;
                padding: clamp(18px, 4vw, 32px);
                text-align: left;
            }
            .fallback h3 {
                font-family: var(--display);
                font-weight: 800;
                font-size: clamp(18px, 4.4vw, 26px);
                text-transform: uppercase;
                margin: 0;
                line-height: 1.1;
            }
            .fallback p {
                margin: 0;
                font-size: 13px;
                color: #cfc9bb;
                max-width: 52ch;
            }
            .fallback code {
                font-family: var(--mono);
                font-size: 12px;
                color: var(--sun);
            }
            .fallback__go {
                align-self: flex-start;
                margin-top: 6px;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                text-decoration: none;
                background: var(--sun);
                color: #100e07;
                padding: 12px 16px;
                font-family: var(--mono);
                font-weight: 700;
                font-size: 11px;
                letter-spacing: 0.2em;
                text-transform: uppercase;
            }

            .ctrl {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 12px 14px;
                border-top: 1px solid var(--line);
                flex-wrap: wrap;
            }
            .ctrl__btn {
                width: 40px;
                height: 40px;
                display: grid;
                place-items: center;
                flex: none;
            }
            .ctrl__btn:hover {
                color: var(--sun);
            }
            .ctrl__time {
                font-family: var(--mono);
                font-size: 11px;
                color: var(--smoke);
                flex: none;
                letter-spacing: 0.06em;
            }
            .ctrl input[type="range"] {
                accent-color: var(--sun);
                height: 22px;
                background: transparent;
                cursor: pointer;
            }
            /* ---------- barra de posição ----------
               A trilha do WebKit/Blink não tem parte "percorrida": o único jeito de
               pintar o trecho já assistido é um gradiente de duas paradas no mesmo
               ponto, e é esse ponto que o JS move em --fill. O Firefox tem
               ::-moz-range-progress e dispensa a conta. */
            .ctrl__seek {
                --fill: 0%;
                flex: 1 1 140px;
                min-width: 110px;
                -webkit-appearance: none;
                appearance: none;
            }
            .ctrl__seek::-webkit-slider-runnable-track {
                height: 0.25rem;
                border-radius: 999px;
                background: linear-gradient(to right, var(--sun) 0 var(--fill), rgba(236, 230, 216, 0.3) var(--fill) 100%);
            }
            /* A margem negativa é metade da diferença entre polegar e trilha: sem ela
               o círculo assenta sobre a trilha em vez de ficar centrado nela. */
            .ctrl__seek::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                width: 0.8rem;
                height: 0.8rem;
                margin-top: -0.275rem;
                border-radius: 50%;
                background: var(--sun);
            }
            .ctrl__seek::-moz-range-track {
                height: 0.25rem;
                border-radius: 999px;
                background: rgba(236, 230, 216, 0.3);
            }
            .ctrl__seek::-moz-range-progress {
                height: 0.25rem;
                border-radius: 999px;
                background: var(--sun);
            }
            .ctrl__seek::-moz-range-thumb {
                width: 0.8rem;
                height: 0.8rem;
                border: 0;
                border-radius: 50%;
                background: var(--sun);
            }
            .ctrl__vol {
                flex: 0 1 90px;
            }
            /* No aparelho de mão o quadro é estreito: tempo e volume saem para a barra
               de posição não ficar espremida entre eles. O botão de mudo permanece —
               é o que resta do controle de som. */
            @media (max-width: 767.98px) {
                .ctrl__time,
                .ctrl__vol {
                    display: none;
                }
            }
            .ctrl[data-disabled="true"] {
                opacity: 0.4;
                pointer-events: none;
            }

            /* ---------- tela cheia ----------
   O pedido de fullscreen vai para o .dialog inteiro, nunca para o iframe: assim
   os controles próprios continuam visíveis e o escudo segue interceptando o
   toque antes da interface do YouTube. Regras separadas de propósito - um
   navegador que não conheça :fullscreen descartaria a lista inteira e levaria
   junto a contingência .is-fs. */
            .dialog:fullscreen {
                width: 100%;
                max-width: none;
                height: 100%;
                border: 0;
                box-shadow: none;
                display: flex;
                flex-direction: column;
                background: #000;
            }
            .dialog:-webkit-full-screen {
                width: 100%;
                max-width: none;
                height: 100%;
                border: 0;
                box-shadow: none;
                display: flex;
                flex-direction: column;
                background: #000;
            }
            .dialog.is-fs {
                position: fixed;
                inset: 0;
                z-index: 90;
                width: 100%;
                max-width: none;
                height: 100%;
                border: 0;
                box-shadow: none;
                display: flex;
                flex-direction: column;
                background: #000;
            }
            .dialog:fullscreen .video {
                flex: 1 1 auto;
                aspect-ratio: auto;
                min-height: 0;
            }
            .dialog:-webkit-full-screen .video {
                flex: 1 1 auto;
                aspect-ratio: auto;
                min-height: 0;
            }
            .dialog.is-fs .video {
                flex: 1 1 auto;
                aspect-ratio: auto;
                min-height: 0;
            }
            .dialog:fullscreen::backdrop {
                background: #000;
            }

            /* ---------- giro por CSS no aparelho de mão ----------
               Contingência para quando screen.orientation.lock não existe ou é
               negada (iPhone, sobretudo): o diálogo inteiro — quadro, barra de
               título e controles — gira 90° e troca largura por altura, ocupando
               a tela no sentido do vídeo. A origem no canto superior esquerdo
               joga o elemento para fora da viewport à esquerda; o left:100vw o
               traz de volta ao lugar. */
            .dialog.is-rotated {
                position: fixed;
                top: 0;
                left: 100vw;
                right: auto;
                bottom: auto;
                width: 100vh;
                height: 100vw;
                transform-origin: top left;
                transform: rotate(90deg);
            }
            /* svh/svw e não dvh/dvw: a unidade dinâmica muda de valor enquanto a barra
               retrátil do navegador encolhe e cresce, e num overlay girado isso vira
               tremor de layout no meio do gesto. A unidade small trava no menor
               tamanho — a barra nunca cobre nada e a medida não oscila. */
            @supports (height: 100svw) {
                .dialog.is-rotated {
                    left: 100svw;
                    width: 100svh;
                    height: 100svw;
                }
            }

            /* ---------- barras sobrepostas ao quadro ----------
   Título e controles flutuam sobre o vídeo para cobrir o alto e a base do quadro,
   onde o YouTube desenha cabeçalho, marca e rodapé. A barra de título é preta
   sólida; a de controles mantém o gradiente, que a deixa assentar sobre a imagem.
   Nenhum dos dois containers recebe ponteiro: o que não for botão continua
   entregando o clique ao escudo, que pausa e retoma o vídeo. */
            .dialog__bar,
            .ctrl {
                position: absolute;
                left: 0;
                right: 0;
                z-index: 6;
                pointer-events: none;
            }
            .dialog__bar > *,
            .ctrl > * {
                pointer-events: auto;
            }
            /* Sem isto o pointer-events:auto dos filhos anularia o bloqueio do container
   enquanto os controles estão desabilitados. */
            .ctrl[data-disabled="true"] > * {
                pointer-events: none;
            }
            /* Preto sólido, sem gradiente: a faixa de fade ainda deixava passar o
               título e a marca que o YouTube desenha no alto do quadro. */
            .dialog__bar {
                top: 0;
                border-bottom: 0;
                padding-bottom: 32px;
                background: var(--curtain);
            }
            .ctrl {
                bottom: 0;
                border-top: 0;
                padding-top: 40px;
                background: linear-gradient(0deg, rgba(6, 5, 4, 0.97) 0%, rgba(6, 5, 4, 0.94) 56%, rgba(6, 5, 4, 0) 100%);
            }
            /* Endcard e contingência cobrem o quadro, mas passam por baixo das barras:
   dar play e arrastar a posição seguem alcançáveis nos dois estados. */
            .endcard,
            .fallback {
                z-index: 5;
            }
            .endcard {
                padding: 64px 16px 84px;
            }
            .fallback {
                padding: 70px clamp(18px, 4vw, 32px) 90px;
            }

            /* ---------- ocultação automática das barras ----------
   O YouTube recolhe o próprio cabeçalho por volta de 3s depois do play; as
   barras só saem 1s depois disso, para o quadro nunca ficar exposto na troca. */
            /* Sumir é suave, aparecer é instantâneo. A transição mora na regra de
               is-idle, que é o estado de destino ao recolher; ao sair de is-idle o
               destino não declara transição, então as barras voltam no mesmo quadro.
               Com fade de entrada, a interface do YouTube fica à vista por baixo
               durante os milissegundos em que elas ganham opacidade. */
            .dialog__bar,
            .ctrl {
                transition: none;
            }
            .dialog.is-idle .dialog__bar,
            .dialog.is-idle .ctrl {
                opacity: 0;
                transition: opacity 0.35s ease;
            }
            .dialog.is-idle .dialog__bar > *,
            .dialog.is-idle .ctrl > * {
                pointer-events: none;
            }
            /* Quem chega por teclado traz a barra de volta mesmo em repouso. */
            .dialog.is-idle .dialog__bar:has(:focus-visible),
            .dialog.is-idle .ctrl:has(:focus-visible) {
                opacity: 1;
            }
            .dialog.is-idle .dialog__bar:has(:focus-visible) > *,
            .dialog.is-idle .ctrl:has(:focus-visible) > * {
                pointer-events: auto;
            }
            /* Reafirmado depois das regras de foco: controle desabilitado nunca é clicável. */
            .dialog .ctrl[data-disabled="true"] > * {
                pointer-events: none;
            }
            /* ---------- capa (facade) ----------
   A miniatura vem por URL direta do CDN de imagens do YouTube: é o mesmo
   arquivo que a Data API v3 devolveria em snippet.thumbnails, sem chave, sem
   cota e sem um round-trip antes do primeiro pixel. O script do player só é
   baixado no primeiro toque — quem nunca dá play não paga por ele. */
            .video__cover {
                position: absolute;
                inset: 0;
                z-index: 1;
                background: #000;
            }
            .video__cover-img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            /* Escurece a base: o texto do botão precisa ler sobre qualquer quadro. */
            .video__cover::after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(0deg, rgba(6, 5, 4, 0.94) 0%, rgba(6, 5, 4, 0.6) 32%, rgba(6, 5, 4, 0) 62%);
            }

            /* Enquanto o player monta, a capa segue por baixo do spinner e a máscara
               vira véu: o quadro nunca pisca preto entre o toque e o primeiro frame. */
            .dialog.is-starting .video__mask {
                background: rgba(6, 5, 4, 0.72);
            }

            /* ---------- o mesmo botão, outra pele ----------
   #trailer-toggle não muda de lugar nem de função: continua dentro da barra de
   controles e continua sendo o play/pause. Na capa ele apenas troca .ctrl__btn
   por .cover__play e revela o texto que já carrega dentro de si. */
            .dialog.is-cover .dialog__bar {
                display: none;
            }
            .dialog.is-cover .ctrl > *:not(#trailer-toggle) {
                display: none;
            }
            .dialog.is-cover .ctrl {
                background: none;
                padding: clamp(1rem, 3.2vw, 2rem);
            }

            .cover__play {
                --play-size: clamp(3.25rem, 11vw, 6.75rem);
                display: flex;
                align-items: center;
                gap: clamp(0.75rem, 2.4vw, 1.5rem);
                flex: 1 1 auto;
                min-width: 0;
                padding: 0;
                text-align: left;
            }
            .cover__play .material-symbols-outlined {
                flex: none;
                display: grid;
                place-items: center;
                width: var(--play-size);
                height: var(--play-size);
                border-radius: 50%;
                background: var(--sun);
                color: #100e07;
                font-size: calc(var(--play-size) * 0.58);
                transition: transform 0.2s ease;
            }
            .cover__play:hover .material-symbols-outlined,
            .cover__play:focus-visible .material-symbols-outlined {
                transform: scale(1.07);
            }
            /* min-width:0 nos dois níveis: sem isso o item flex adota a largura do
               conteúdo e o text-overflow nunca chega a cortar nada. */
            .cover__text {
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 0.1rem;
            }
            .cover__kicker {
                font-family: var(--display);
                font-weight: 800;
                font-size: clamp(1rem, 3vw, 1.85rem);
                letter-spacing: 0.05em;
                text-transform: uppercase;
                color: var(--sun);
                line-height: 1.2;
            }
            .cover__name {
                font-family: var(--display);
                font-weight: 700;
                font-size: clamp(1rem, 3.2vw, 2rem);
                color: var(--bone);
                line-height: 1.25;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            @media (prefers-reduced-motion: reduce) {
                .dialog__bar,
                .ctrl,
                .dialog.is-idle .dialog__bar,
                .dialog.is-idle .ctrl {
                    transition: none;
                }
                .cover__play .material-symbols-outlined {
                    transition: none;
                }
            }
        </style>
    </head>

    <body>
        <div class="dialog is-cover">
            <div class="dialog__bar">
                <p class="dialog__title" id="dialog-title"><b>Trailer</b> — <span id="dialog-name">Kill Bill: Vol. 1</span></p>
            </div>

            <div class="video">
                <div class="video__stage"><div id="trailer-player"></div></div>
                <!-- src literal de propósito: o download começa no parse do HTML, antes
                     do script no fim do body. O JS deriva a mesma URL de VIDEO_ID e cuida
                     da queda para hqdefault quando maxres não existe. -->
                <div class="video__cover" id="trailer-cover">
                    <img class="video__cover-img" id="trailer-cover-img" src="https://i.ytimg.com/vi/Wv3kZxK9dwA/maxresdefault.jpg" alt="" decoding="async" fetchpriority="high" />
                </div>
                <div class="video__shield" id="trailer-shield" aria-hidden="true"></div>
                <div class="endcard" id="trailer-endcard" hidden>
                    <p class="endcard__t">Fim do trailer</p>
                    <button type="button" class="endcard__btn" id="trailer-replay">
                        <span class="material-symbols-outlined" aria-hidden="true">replay</span>
                        Assistir de novo
                    </button>
                </div>
                <div class="video__mask" id="trailer-mask" hidden><div class="spinner" role="status" aria-label="Carregando o player"></div></div>
                <div class="fallback" id="trailer-fallback" hidden>
                    <h3 id="fallback-title">O YouTube recusou a reprodução aqui</h3>
                    <p id="fallback-desc">
                        O player incorporado exige uma origem <code>http</code> ou <code>https</code>. Este arquivo foi aberto direto do armazenamento do aparelho, então o YouTube devolve o erro 153.
                        Sirva a página por HTTP para assistir aqui dentro.
                    </p>
                    <button type="button" class="fallback__go" id="fallback-retry">
                        Tentar novamente
                        <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
                    </button>
                </div>
            </div>

            <div class="ctrl" id="trailer-controls" data-disabled="false">
                <button type="button" class="cover__play" id="trailer-toggle" aria-label="Assistir ao trailer">
                    <span class="material-symbols-outlined" id="toggle-icon" aria-hidden="true">play_arrow</span>
                    <span class="cover__text" id="cover-text">
                        <span class="cover__kicker">Assistir</span>
                        <span class="cover__name" id="cover-name">Kill Bill: Volume 1 | Official Trailer</span>
                    </span>
                </button>
                <span class="ctrl__time" id="trailer-time">0:00 / 0:00</span>
                <input class="ctrl__seek" id="trailer-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Posição do vídeo" />
                <button type="button" class="ctrl__btn" id="trailer-mute" aria-label="Ativar ou desativar o som">
                    <span class="material-symbols-outlined" id="mute-icon" aria-hidden="true">volume_up</span>
                </button>
                <input class="ctrl__vol" id="trailer-volume" type="range" min="0" max="100" value="100" step="1" aria-label="Volume" />
                <button type="button" class="ctrl__btn" id="trailer-fullscreen" aria-label="Tela cheia" aria-pressed="false">
                    <span class="material-symbols-outlined" id="fullscreen-icon" aria-hidden="true">fullscreen</span>
                </button>
            </div>
        </div>

        <script>
            (function () {
                "use strict";

                /* ---------------------------------------------------------------
                   1. O vídeo
                      Nenhum arquivo é armazenado ou intermediado: a página guarda
                      apenas o identificador, e a reprodução acontece no player
                      incorporado do YouTube.
                ----------------------------------------------------------------*/
                var VIDEO_ID = "Wv3kZxK9dwA";

                /* Miniatura oficial servida pelo CDN de imagens do YouTube — o mesmo
                   arquivo que a Data API v3 devolveria em snippet.thumbnails, só que
                   sem chave exposta no cliente e sem cota diária para estourar.
                   maxres só existe quando o upload tinha 720p ou mais; quando não
                   existe, o CDN responde 200 com um cinza de 120x90 em vez de 404 —
                   por isso a checagem em paintCover() mede a imagem e não escuta erro. */
                var COVER_HQ = "https://i.ytimg.com/vi/" + VIDEO_ID + "/hqdefault.jpg";

                /* ---------------------------------------------------------------
                   2. Estado
                ----------------------------------------------------------------*/
                var isHttp = /^https?:$/.test(window.location.protocol);
                var player = null;
                var ready = false;
                var watchdog = null;
                var ticker = null;
                var seeking = false;

                var dialog = document.querySelector(".dialog");
                var mask = document.getElementById("trailer-mask");
                var fallback = document.getElementById("trailer-fallback");
                var fbTitle = document.getElementById("fallback-title");
                var fbDesc = document.getElementById("fallback-desc");
                var fbRetry = document.getElementById("fallback-retry");
                var shield = document.getElementById("trailer-shield");
                var endcard = document.getElementById("trailer-endcard");
                var replayBtn = document.getElementById("trailer-replay");
                var controls = document.getElementById("trailer-controls");
                var toggleBtn = document.getElementById("trailer-toggle");
                var toggleIcon = document.getElementById("toggle-icon");
                var muteBtn = document.getElementById("trailer-mute");
                var muteIcon = document.getElementById("mute-icon");
                var seek = document.getElementById("trailer-seek");
                var volume = document.getElementById("trailer-volume");
                var timeEl = document.getElementById("trailer-time");
                var cover = document.getElementById("trailer-cover");
                var coverImg = document.getElementById("trailer-cover-img");
                var coverText = document.getElementById("cover-text");
                var fsBtn = document.getElementById("trailer-fullscreen");
                var fsIcon = document.getElementById("fullscreen-icon");

                /* ---------------------------------------------------------------
                   3. YouTube IFrame Player API — carregada sob demanda
                ----------------------------------------------------------------*/
                var apiPromise = null;

                function loadApi() {
                    if (apiPromise) return apiPromise;
                    apiPromise = new Promise(function (resolve, reject) {
                        if (window.YT && window.YT.Player) {
                            resolve(window.YT);
                            return;
                        }
                        var prev = window.onYouTubeIframeAPIReady;
                        window.onYouTubeIframeAPIReady = function () {
                            if (typeof prev === "function") prev();
                            resolve(window.YT);
                        };
                        var s = document.createElement("script");
                        s.src = "https://www.youtube.com/iframe_api";
                        s.onerror = function () {
                            reject(new Error("api"));
                        };
                        document.head.appendChild(s);
                        setTimeout(function () {
                            if (!(window.YT && window.YT.Player)) reject(new Error("timeout"));
                        }, 8000);
                    });
                    return apiPromise;
                }

                function playerVars() {
                    var vars = {
                        autoplay: 1,
                        controls: 0,
                        /* O vídeo fica sempre dentro do quadro, em todo aparelho. O
                           fullscreen nativo do iOS exigia devolver o toque ao iframe, e
                           junto com ele voltava a interface do YouTube; tela cheia agora
                           é sempre a do diálogo, com o giro por CSS como contingência. */
                        playsinline: 1,
                        rel: 0,
                        fs: 0,
                        enablejsapi: 1,
                        /* Descontinuado pelo YouTube em 2023 e hoje ignorado — mantido por
                           ser inofensivo. Quem apaga a marca do quadro é controls:0. */
                        modestbranding: 1,
                        iv_load_policy: 3,
                        cc_load_policy: 0,
                        disablekb: 1,
                    };
                    /* origin só é válido em http/https; enviá-lo de um arquivo local causa o erro 153 */
                    if (isHttp) vars.origin = window.location.origin;
                    return vars;
                }

                function createTrailerPlayer() {
                    player = new YT.Player("trailer-player", {
                        /* nocookie exige origem confiável; fora de http usamos o domínio padrão */
                        host: isHttp ? "https://www.youtube-nocookie.com" : "https://www.youtube.com",
                        videoId: VIDEO_ID,
                        playerVars: playerVars(),
                        events: {
                            onReady: onPlayerReady,
                            onStateChange: onPlayerState,
                            onError: function (e) {
                                showFallback(e && e.data);
                            },
                        },
                    });
                }

                function onPlayerReady() {
                    ready = true;
                    clearTimeout(watchdog);
                    /* pointer-events:none barra o ponteiro, não o foco: sem isto o Tab
                       entra no documento do YouTube, e a partir dali os atalhos daqui
                       param de receber tecla. O conteúdo é redundante com os controles
                       próprios, então sai também da árvore de acessibilidade. */
                    try {
                        var frame = player.getIframe();
                        frame.setAttribute("tabindex", "-1");
                        frame.setAttribute("aria-hidden", "true");
                    } catch (err) {}
                    dialog.classList.remove("is-starting");
                    /* A capa NÃO sai aqui. Pronto não é o mesmo que tocando: se o
                       navegador recusar o play — política de autoplay, o caso comum em
                       aparelho de mão e em janela estreita —, esconder a capa agora
                       deixaria o quadro do YouTube à mostra com a tela inicial inteira:
                       título, canal, botão vermelho no meio e a marca no rodapé. Nada
                       disso está ao alcance dos gradientes das barras, que só cobrem
                       topo e base. Quem tira a capa é o primeiro PLAYING, em
                       onPlayerState; até lá a miniatura cobre o quadro e o usuário tem
                       o play dos controles próprios para iniciar por conta. */
                    mask.hidden = true;
                    controls.dataset.disabled = "false";
                    try {
                        player.setVolume(Number(volume.value));
                        player.playVideo();
                    } catch (err) {
                        /* o usuário pode iniciar pelos controles próprios */
                    }
                    startTicker();
                }

                function onPlayerState(e) {
                    var playing = e.data === YT.PlayerState.PLAYING;
                    toggleIcon.textContent = playing ? "pause" : "play_arrow";
                    toggleBtn.setAttribute("aria-label", playing ? "Pausar" : "Reproduzir");
                    if (playing) {
                        /* Só aqui existe imagem em movimento por baixo: é o momento
                           seguro de descobrir o quadro. */
                        cover.hidden = true;
                        endcard.hidden = true;
                        armIdle();
                    }
                    /* Pausar não mexe nas barras: elas ficam como o usuário as deixou.
                       O timer de repouso que tenha ficado armado é inofensivo, porque
                       hideBars() desiste quando não há reprodução. Fim de trailer e
                       contingência têm tratamento próprio, em finishTrailer() e
                       showFallback(), e continuam chamando cancelIdle(). */
                    if (e.data === YT.PlayerState.ENDED) finishTrailer();
                }

                /* Encerra antes da tela de sugestões do YouTube aparecer. */
                function finishTrailer() {
                    cancelIdle();
                    if (!player) return;
                    try {
                        player.pauseVideo();
                        player.seekTo(0, true);
                    } catch (err) {}
                    seek.value = "0";
                    paintSeek();
                    toggleIcon.textContent = "play_arrow";
                    endcard.hidden = false;
                }

                /* ---------------------------------------------------------------
                   4. Contingência quando o YouTube recusa o player
                ----------------------------------------------------------------*/
                function showFallback(code) {
                    cancelIdle();
                    clearTimeout(watchdog);
                    stopTicker();
                    ready = false;
                    dialog.classList.remove("is-starting");
                    cover.hidden = true;
                    mask.hidden = true;
                    controls.dataset.disabled = "true";
                    destroyTrailerPlayer();

                    if (isHttp) {
                        fbTitle.textContent = "Este vídeo não permite reprodução incorporada";
                        fbDesc.textContent =
                            "O canal bloqueou a exibição fora do YouTube ou o vídeo está indisponível na sua região" + (code ? " (código " + code + ")" : "") + ".";
                    } else {
                        fbTitle.textContent = "O YouTube recusou a reprodução aqui";
                        fbDesc.textContent =
                            "O player incorporado exige uma origem http ou https. Este arquivo foi aberto direto do armazenamento do aparelho, por isso o YouTube devolve o erro 153. " +
                            "Sirva a página por HTTP para assistir aqui dentro.";
                    }
                    fallback.hidden = false;
                }

                /* ---------------------------------------------------------------
                   5. Montagem e destruição
                ----------------------------------------------------------------*/
                function mountTrailer() {
                    cancelIdle();
                    fallback.hidden = true;
                    endcard.hidden = true;
                    mask.hidden = false;
                    controls.dataset.disabled = "true";
                    toggleIcon.textContent = "play_arrow";
                    seek.value = 0;
                    paintSeek();
                    timeEl.textContent = "0:00 / 0:00";

                    watchdog = setTimeout(function () {
                        if (!ready) showFallback(null);
                    }, 6500);

                    loadApi()
                        .then(function () {
                            createTrailerPlayer();
                        })
                        .catch(function () {
                            showFallback(null);
                        });
                }

                function destroyTrailerPlayer() {
                    if (!player) return;
                    try {
                        player.destroy();
                    } catch (err) {}
                    player = null;
                    ready = false;
                    var stage = dialog.querySelector(".video__stage");
                    stage.innerHTML = "";
                    var slot = document.createElement("div");
                    slot.id = "trailer-player";
                    stage.appendChild(slot);
                }

                /* ---------------------------------------------------------------
                   5b. Capa (facade)
                      Nada do YouTube é baixado antes do primeiro toque: a página
                      mostra a miniatura e só monta o player quando o usuário pede.
                ----------------------------------------------------------------*/
                function isCover() {
                    return dialog.classList.contains("is-cover");
                }

                /* O botão é o mesmo elemento nos dois estados — troca de pele, nunca
                   de função. Quem decide entre montar e alternar é o handler de clique. */
                function paintToggleSkin(onCover) {
                    toggleBtn.classList.toggle("cover__play", onCover);
                    toggleBtn.classList.toggle("ctrl__btn", !onCover);
                    coverText.hidden = !onCover;
                    toggleBtn.setAttribute("aria-label", onCover ? "Assistir ao trailer" : "Reproduzir ou pausar");
                }

                /* Um maxres inexistente chega como 200 com um cinza de 120x90, então o
                   teste é a medida da imagem; onerror sozinho não pegaria esse caso.
                   hqdefault tem 480x360 e existe para todo vídeo — não há recursão. */
                function paintCover() {
                    function degrade() {
                        if (coverImg.src !== COVER_HQ) coverImg.src = COVER_HQ;
                    }
                    function measure() {
                        if (coverImg.naturalWidth === 120 && coverImg.naturalHeight === 90) degrade();
                    }
                    /* A imagem pode ter resolvido antes deste script rodar: o evento já
                       teria passado, então o estado é lido de complete/naturalWidth. */
                    if (coverImg.complete) {
                        if (coverImg.naturalWidth) measure();
                        else degrade();
                        return;
                    }
                    coverImg.addEventListener("load", measure, { once: true });
                    coverImg.addEventListener("error", degrade, { once: true });
                }

                function startFromCover() {
                    if (!isCover()) return;
                    dialog.classList.remove("is-cover");
                    /* is-starting mantém a capa sob o véu do spinner até o player responder. */
                    dialog.classList.add("is-starting");
                    paintToggleSkin(false);
                    mountTrailer();
                }

                /* ---------------------------------------------------------------
                   6. Controles próprios (controls=0)
                ----------------------------------------------------------------*/
                function fmt(sec) {
                    sec = Math.max(0, Math.floor(sec || 0));
                    var m = Math.floor(sec / 60),
                        s = sec % 60;
                    return m + ":" + (s < 10 ? "0" : "") + s;
                }

                /* O trecho percorrido é desenhado por gradiente na trilha, e o gradiente
                   só sabe onde parar se alguém lhe contar: toda escrita em seek.value
                   passa por aqui. */
                function paintSeek() {
                    const pct = (Number(seek.value) / Number(seek.max)) * 100;
                    seek.style.setProperty("--fill", pct + "%");
                }

                function startTicker() {
                    stopTicker();
                    ticker = setInterval(function () {
                        if (!player || !ready || seeking) return;
                        var d = player.getDuration ? player.getDuration() : 0;
                        var c = player.getCurrentTime ? player.getCurrentTime() : 0;
                        timeEl.textContent = fmt(c) + " / " + fmt(d);
                        if (d > 0) {
                            seek.value = String(Math.round((c / d) * 1000));
                            paintSeek();
                        }
                        if (d > 0 && d - c <= 1.1 && player.getPlayerState() === YT.PlayerState.PLAYING) finishTrailer();
                    }, 250);
                }
                function stopTicker() {
                    if (ticker) {
                        clearInterval(ticker);
                        ticker = null;
                    }
                }

                function togglePlayback() {
                    if (!player || !ready) return;
                    if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
                    else player.playVideo();
                }

                toggleBtn.addEventListener("click", function () {
                    if (isCover()) startFromCover();
                    else togglePlayback();
                });

                /* Toque sobre o vídeo é tratado aqui e nunca chega ao iframe. */
                shield.addEventListener("click", function () {
                    if (isCover()) {
                        startFromCover();
                        return;
                    }
                    if (!endcard.hidden) return;
                    togglePlayback();
                });

                replayBtn.addEventListener("click", function () {
                    endcard.hidden = true;
                    if (player && ready) {
                        player.seekTo(0, true);
                        player.playVideo();
                    }
                });

                muteBtn.addEventListener("click", function () {
                    if (!player || !ready) return;
                    if (player.isMuted()) {
                        player.unMute();
                        muteIcon.textContent = "volume_up";
                    } else {
                        player.mute();
                        muteIcon.textContent = "volume_off";
                    }
                });

                volume.addEventListener("input", function (e) {
                    if (!player || !ready) return;
                    var v = Number(e.target.value);
                    player.setVolume(v);
                    if (v === 0) {
                        player.mute();
                        muteIcon.textContent = "volume_off";
                    } else if (player.isMuted()) {
                        player.unMute();
                        muteIcon.textContent = "volume_up";
                    }
                });

                seek.addEventListener("pointerdown", function () {
                    seeking = true;
                });
                /* Durante o arraste o ticker está suspenso por `seeking`; sem isto o
                   trecho pintado ficaria parado atrás do polegar. Vale também para as
                   setas do teclado. */
                seek.addEventListener("input", paintSeek);
                seek.addEventListener("change", function (e) {
                    seeking = false;
                    if (!player || !ready) return;
                    var d = player.getDuration();
                    if (d > 0) player.seekTo((Number(e.target.value) / 1000) * d, true);
                });

                /* ---------------------------------------------------------------
                   7. Tela cheia
                ----------------------------------------------------------------*/
                function fsElement() {
                    return document.fullscreenElement || document.webkitFullscreenElement || null;
                }
                function isFullscreen() {
                    return fsElement() === dialog || dialog.classList.contains("is-fs");
                }
                function paintFsIcon() {
                    var on = isFullscreen();
                    fsIcon.textContent = on ? "fullscreen_exit" : "fullscreen";
                    fsBtn.setAttribute("aria-pressed", on ? "true" : "false");
                    fsBtn.setAttribute("aria-label", on ? "Sair da tela cheia" : "Tela cheia");
                }
                /* Contingência: o Safari do iPhone só concede fullscreen a <video>, nunca a um
                   elemento comum. Nesse caso o diálogo cobre a viewport por CSS. */
                function fallbackFs() {
                    dialog.classList.add("is-fs");
                    paintFsIcon();
                }
                function enterFullscreen() {
                    var req = dialog.requestFullscreen || dialog.webkitRequestFullscreen;
                    if (!req) {
                        fallbackFs();
                        goLandscape();
                        return;
                    }
                    try {
                        Promise.resolve(req.call(dialog))
                            .catch(fallbackFs)
                            .then(function () {
                                paintFsIcon();
                                goLandscape();
                            });
                    } catch (err) {
                        fallbackFs();
                        goLandscape();
                    }
                }
                function exitFullscreen() {
                    releaseLandscape();
                    dialog.classList.remove("is-fs");
                    if (fsElement() === dialog) {
                        var exit = document.exitFullscreen || document.webkitExitFullscreen;
                        if (exit) {
                            try {
                                Promise.resolve(exit.call(document)).catch(function () {});
                            } catch (err) {}
                        }
                    }
                    paintFsIcon();
                }

                /* ---------------------------------------------------------------
                   7b. Paisagem forçada em aparelho de mão

                   Duas rotas, porque nenhuma cobre todos os aparelhos:
                   1) screen.orientation.lock("landscape") — Android/Chromium.
                      Gira de verdade a interface do sistema, mas só é aceita
                      com o fullscreen já ativo.
                   2) Giro por CSS — iPhone, onde não existe fullscreen de
                      elemento comum nem orientation.lock. Só o conteúdo gira;
                      o sistema segue em retrato.
                ----------------------------------------------------------------*/
                var portraitMQ = window.matchMedia("(orientation: portrait)");
                var rotateByCss = false;

                /* Sem sniffing de user-agent: perguntamos pelas capacidades que
                   importam — ponteiro grosso, toque real e tela fisicamente
                   estreita. Um notebook com tela sensível ao toque falha no
                   terceiro teste e fica de fora. */
                function isHandheld() {
                    if (navigator.userAgentData && typeof navigator.userAgentData.mobile === "boolean") {
                        return navigator.userAgentData.mobile;
                    }
                    var coarse = window.matchMedia("(pointer: coarse)").matches;
                    var touch = (navigator.maxTouchPoints || 0) > 0;
                    var menor = Math.min(window.screen.width || 0, window.screen.height || 0);
                    return coarse && touch && menor > 0 && menor <= 820;
                }

                function applyRotation() {
                    var girar = rotateByCss && portraitMQ.matches && isFullscreen();
                    dialog.classList.toggle("is-rotated", girar);
                }

                function lockLandscape() {
                    var o = window.screen && window.screen.orientation;
                    if (!o || typeof o.lock !== "function") return Promise.reject(new Error("sem lock"));
                    return o.lock("landscape");
                }

                function goLandscape() {
                    if (!isHandheld()) return;
                    lockLandscape()
                        .then(function () {
                            rotateByCss = false;
                            applyRotation();
                        })
                        .catch(function () {
                            rotateByCss = true;
                            applyRotation();
                        });
                }

                function releaseLandscape() {
                    rotateByCss = false;
                    dialog.classList.remove("is-rotated");
                    var o = window.screen && window.screen.orientation;
                    if (o && typeof o.unlock === "function") {
                        try {
                            o.unlock();
                        } catch (err) {}
                    }
                }

                /* Aparelho girado na mão dispensa o giro por CSS — sem isto o
                   vídeo ficaria de lado quando o usuário virasse o telefone. */
                if (portraitMQ.addEventListener) portraitMQ.addEventListener("change", applyRotation);
                else if (portraitMQ.addListener) portraitMQ.addListener(applyRotation);

                function toggleFullscreen() {
                    if (isFullscreen()) exitFullscreen();
                    else enterFullscreen();
                }

                paintFsIcon();
                fsBtn.addEventListener("click", toggleFullscreen);
                /* Saída pelo botão do sistema (Escape, gesto) também desfaz o giro. */
                function onFsChange() {
                    paintFsIcon();
                    if (!isFullscreen()) releaseLandscape();
                    else applyRotation();
                }
                document.addEventListener("fullscreenchange", onFsChange);
                document.addEventListener("webkitfullscreenchange", onFsChange);

                /* ---------------------------------------------------------------
                   8. Repouso das barras
                ----------------------------------------------------------------*/
                /* O cabeçalho do YouTube sai por volta de 3s após o play; somamos 1s de
                   folga para que as barras próprias só recuem depois dele, nunca antes. */
                var YT_OVERLAY_MS = 3000;
                var BAR_EXTRA_MS = 1000;
                var IDLE_MS = YT_OVERLAY_MS + BAR_EXTRA_MS;

                var idleTimer = null;

                function isPlaying() {
                    return !!(player && ready && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING);
                }
                function hideBars() {
                    if (!isPlaying()) return;
                    if (!endcard.hidden || !fallback.hidden) return;
                    dialog.classList.add("is-idle");
                }
                /* Traz as barras de volta e reinicia a contagem. */
                function armIdle() {
                    clearTimeout(idleTimer);
                    dialog.classList.remove("is-idle");
                    idleTimer = setTimeout(hideBars, IDLE_MS);
                }
                /* Traz as barras de volta e as mantém: fim de trailer, erro. */
                function cancelIdle() {
                    clearTimeout(idleTimer);
                    idleTimer = null;
                    dialog.classList.remove("is-idle");
                }

                /* Nenhum gesto de ponteiro reexibe as barras — nem mover o mouse sobre o
                   quadro, nem pousá-lo sobre uma das barras, nem clicar. Recolhidas, elas
                   só voltam quando a reprodução recomeça, quando o trailer acaba ou quando
                   a contingência aparece. O teclado é a exceção deliberada: o armIdle() do
                   keydown e o :has(:focus-visible) no CSS mantêm os controles alcançáveis
                   para quem não usa mouse. */

                /* ---------------------------------------------------------------
                   9. Gatilhos
                ----------------------------------------------------------------*/
                fbRetry.addEventListener("click", function () {
                    fallback.hidden = true;
                    mask.hidden = false;
                    destroyTrailerPlayer();
                    watchdog = setTimeout(function () {
                        if (!ready) showFallback(null);
                    }, 6500);
                    loadApi()
                        .then(function () {
                            createTrailerPlayer();
                        })
                        .catch(function () {
                            showFallback(null);
                        });
                });

                document.addEventListener("keydown", function (e) {
                    if (e.key === "Escape") {
                        /* No fullscreen nativo o próprio navegador consome o Escape; aqui ele só
                           chega quando a contingência .is-fs está ativa. */
                        if (dialog.classList.contains("is-fs")) exitFullscreen();
                        return;
                    }
                    if (isPlaying()) armIdle();
                    var tag = document.activeElement ? document.activeElement.tagName : "";
                    if ((e.key === "f" || e.key === "F") && tag !== "INPUT" && tag !== "TEXTAREA") {
                        e.preventDefault();
                        toggleFullscreen();
                    }
                });

                /* A página abre na capa — o estado inicial já vem marcado no HTML, então
                   não há troca visível aqui; resta só corrigir a miniatura se preciso. */
                paintCover();
            })();
        </script>
    </body>
</html>
